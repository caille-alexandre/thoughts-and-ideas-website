services:
  nextjs-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-portfolio
    restart: unless-stopped
    user: "1026:1026"
    ports:
      - "3010:3000"
    volumes:
      - type: bind
        source: /volume1/homes/alexandrecaille/5 - COLD STORAGE/personal-projects/design-portfolio
        target: /app/content
        read_only: true
    environment:
      - NODE_ENV=production
      - LAB_PASSWORD=${LAB_PASSWORD}
      - LAB_TOKEN=${LAB_TOKEN}
